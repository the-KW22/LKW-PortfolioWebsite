<style>
:root{--bg:#07070a;--ink:#ecebf3;--mute:#8b8a99;--line:#1f1e29;--violet:#8b7bff;--lime:#c6f432}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;overflow-x:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#hero{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;align-items:flex-end;padding:0 clamp(20px,4vw,64px) clamp(28px,5vh,56px)}
#hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top right,rgba(7,7,10,.85),rgba(7,7,10,0) 60%)}
.eyebrow{font:500 12px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:2vh;opacity:0;transition:opacity .8s .1s}
.eyebrow i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);margin-right:10px;vertical-align:1px}
h1{font-weight:900;font-size:clamp(40px,10.5vw,176px);line-height:.86;letter-spacing:-.055em}
.ln{display:block;overflow:hidden;padding-bottom:.07em}
.ln>span{display:block;transform:translateY(112%)}
h1 em{font:italic 400 1.04em "Instrument Serif",serif;color:var(--violet);letter-spacing:-.03em}
.intro{max-width:560px;color:var(--mute);font-size:clamp(15px,1.3vw,19px);line-height:1.4;margin:3vh 0;opacity:0;transform:translateY(14px);transition:opacity .9s .55s,transform .9s .55s}
.btn{pointer-events:auto;display:inline-block;background:var(--lime);color:#07070a;font-weight:700;padding:14px 26px;border-radius:999px;text-decoration:none;opacity:0;transform:translateY(14px);transition:opacity .9s .7s,transform .9s .7s}
.in .ln>span{transform:none;transition:transform 1.1s cubic-bezier(.16,1,.3,1) calc(var(--i)*.12s)}
.in .eyebrow{opacity:1}.in .intro,.in .btn{opacity:1;transform:none}
.tag,.back{position:fixed;top:16px;z-index:6;font:500 11px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--mute);background:rgba(7,7,10,.6);border:1px solid var(--line);border-radius:999px;padding:8px 14px;backdrop-filter:blur(8px)}
.tag{right:16px;display:flex;gap:12px;align-items:center}.tag b{color:var(--ink)}
.tag button{font:inherit;color:#07070a;background:var(--lime);border:0;border-radius:99px;padding:4px 10px;cursor:pointer}
.back{left:16px;text-decoration:none}.back:hover{color:var(--ink)}
#lens{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;border:1.5px solid var(--lime);box-shadow:0 0 36px rgba(198,244,50,.28),inset 0 0 50px rgba(198,244,50,.08);pointer-events:none;z-index:3;opacity:0}
#lens span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font:500 10px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--lime)}
#atlas{position:relative;z-index:4;min-height:100vh;background:var(--bg);border-top:1px solid var(--line);display:grid;place-items:center;font:500 clamp(14px,2vw,22px) "JetBrains Mono",monospace;color:var(--mute);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<canvas id="gl"></canvas>
<div id="lens"><span>X-RAY</span></div>
<a class="back" href="index.html">&larr; all options</a>
<div class="tag"><span><b>A</b> Blueprint &rarr; Build</span><button id="replay">Replay &#8635;</button></div>
<div id="hero"><div>
  <div class="eyebrow"><i></i>Leow Kai Wen &middot; Full-stack developer &middot; AI engineer &middot; Open to work</div>
  <h1><span class="ln"><span style="--i:0">I design</span></span><span class="ln"><span style="--i:1">and <em>build</em></span></span><span class="ln"><span style="--i:2">whole products.</span></span></h1>
  <p class="intro">I take products from idea to production: interfaces, APIs, databases and the AI that ties them together.</p>
  <a class="btn" href="#atlas">See projects &darr;</a>
</div></div>
<div style="height:150vh"></div>
<section id="atlas">03 &mdash; Personal projects (Atlas)</section>

<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
THREE.ColorManagement.enabled = false; // shaders below output raw sRGB values

const $ = s => document.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(devicePixelRatio || 1, 2);
const cl = x => Math.min(1, Math.max(0, x));
const sm = (a, b, x) => { x = cl((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

const renderer = new THREE.WebGLRenderer({ canvas: $("#gl"), antialias: true });
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x07070a);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
const grp = new THREE.Group();
scene.add(grp);

// uniforms shared by every shader (same {value} objects)
const U = {
  uDraw: { value: 0 }, uBuild: { value: 0 }, uFade: { value: 0 }, uPack: { value: 0 },
  uLens: { value: new THREE.Vector2(-999, -999) }, uR: { value: 0 }, uTime: { value: 0 }, uIn: { value: 0 }, uPx: { value: DPR },
};
const LENS = `uniform vec2 uLens; uniform float uR;
float lensIn(float soft){ return 1.0 - smoothstep(uR - soft, uR, distance(gl_FragCoord.xy, uLens)); }`;

// ---- materials ----
const lineMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float aT; varying float vT;
    void main(){ vT = aT; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `${LENS} uniform float uDraw, uBuild, uFade; varying float vT;
    void main(){
      if (vT > uDraw) discard;
      float inside = lensIn(8.0);
      float tip = 1.0 - clamp((uDraw - vT) * 14.0, 0.0, 1.0);          // bright growing tip
      float a = mix(mix(1.0, 0.4, uBuild), 1.0, inside);               // dim after build, full inside lens
      vec3 c = mix(vec3(.545, .482, 1.0), vec3(.8, .78, 1.0), inside) + tip * .6;
      gl_FragColor = vec4(c, a * (1.0 - uFade));
    }`,
});
function solid(base, rim) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uBase: { value: new THREE.Color(base) }, uRim: { value: new THREE.Color(rim) } },
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    vertexShader: `varying vec3 vN; varying vec3 vV;
      void main(){ vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = -mv.xyz; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `${LENS} uniform vec3 uBase, uRim; uniform float uBuild, uFade; varying vec3 vN; varying vec3 vV;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        if (distance(gl_FragCoord.xy, uLens) < uR) discard;                        // X-ray lens: see through
        if (hash(floor(gl_FragCoord.xy / 2.0)) > uBuild * (1.0 - uFade)) discard;  // dithered "fill in"
        vec3 n = normalize(vN);
        float l = max(dot(n, normalize(vec3(.4, .8, .6))), 0.0);
        float f = pow(1.0 - max(dot(n, normalize(vV)), 0.0), 2.5);
        gl_FragColor = vec4(uBase * (.35 + .9 * l) + uRim * f * .55, 1.0);
      }`,
  });
}
const mats = {
  ui: solid(0x1d1c36, 0x8b7bff), ui2: solid(0x2a2752, 0xb4a8ff),
  api: solid(0x262152, 0x8b7bff), db: solid(0x1b2a44, 0x7aa8ff), ai: solid(0x2b3a0c, 0xc6f432),
};

// ---- floor ----
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false,
  vertexShader: `varying vec3 vP; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uIn, uFade, uTime; varying vec3 vP;
    float gridLine(vec2 q){ vec2 g = abs(fract(q - .5) - .5) / fwidth(q); return 1.0 - min(min(g.x, g.y), 1.0); }
    void main(){
      vec2 p = vP.xz - vec2(0.0, uTime * .4);
      float l = max(gridLine(p) * .3, gridLine(p / 5.0) * .8);
      float d = length(vP.xz - vec2(0.0, -4.0));
      float R = uIn * 50.0;
      float a = l * (1.0 - smoothstep(8.0, 38.0, d)) * (1.0 - smoothstep(R - 10.0, R, d));
      a += smoothstep(R - 1.5, R, d) * (1.0 - smoothstep(R, R + 1.0, d)) * .6 * (1.0 - uIn);   // reveal ring
      gl_FragColor = vec4(.545, .482, 1.0, a * .6 * (1.0 - uFade));
    }`,
}));
floor.position.y = -3.2;
floor.frustumCulled = false;
scene.add(floor);

// ---- product parts ----
let cur = 0;
const parts = {};
function part(name, base, ex) {
  const n = new THREE.Group();
  n.userData = { base: V3(...base), ex: V3(...ex) };
  n.position.copy(n.userData.base);
  grp.add(n); parts[name] = n; return n;
}
function stamp(g, start, span) { // per-vertex draw time: segments grow in sequence
  const n = g.attributes.position.count, t = new Float32Array(n);
  for (let i = 0; i < n; i += 2) { const a = start + span * (i / n); t[i] = a; t[i + 1] = a + 0.07; }
  g.setAttribute("aT", new THREE.BufferAttribute(t, 1));
}
function add(node, geo, x, y, z, kind, thr = 1) {
  const m = new THREE.Mesh(geo, mats[kind]);
  m.position.set(x, y, z);
  const eg = new THREE.EdgesGeometry(geo, thr);
  stamp(eg, cur, 0.05); cur += 0.016;
  const l = new THREE.LineSegments(eg, lineMat);
  l.position.copy(m.position);
  node.add(m, l);
}
const box = (n, w, h, d, x, y, z, k) => add(n, new THREE.BoxGeometry(w, h, d), x, y, z, k);

const APP = [-2.6, 0.4, 0];
box(part("frame", APP, [-1, 0, -1.8]), 5.2, 3.4, 0.12, 0, 0, 0, "ui");
const chrome = part("chrome", APP, [-1, 0.3, -0.5]);
box(chrome, 4.9, 0.34, 0.06, 0, 1.4, 0.09, "ui2");
box(chrome, 1.0, 2.5, 0.06, -1.9, -0.2, 0.09, "ui2");
[0, 1, 2].forEach(i => box(chrome, 0.14, 0.14, 0.08, -2.2 + i * 0.22, 1.4, 0.14, "api"));
const cards = part("cards", APP, [-1, 0, 0.9]);
[-0.65, 0.5, 1.65].forEach(x => box(cards, 1.05, 0.8, 0.08, x, 0.6, 0.12, "ui"));
const bars = part("bars", APP, [-1, -0.3, 2.1]);
[0.5, 0.9, 0.65, 1.1, 0.8, 1.3].forEach((h, i) => box(bars, 0.22, h, 0.1, -1.0 + i * 0.38, -1.25 + h / 2, 0.12, "ai"));
[0, 1, 2].forEach(i => box(bars, 1.7 - i * 0.4, 0.07, 0.05, 1.5, -0.4 - i * 0.28, 0.12, "ui2"));
[[1.9, 1.7], [1.9, 0.4], [1.9, -0.9]].forEach(([x, y], i) => {
  const n = part("api" + (i + 1), [x, y, 0], [1.2, (1 - i) * 0.7, 1.2]);
  box(n, 1.2, 0.8, 0.8, 0, 0, 0, "api");
  box(n, 1.0, 0.06, 0.6, 0, 0.46, 0, "ui2");
});
const db = part("db", [4.7, -0.9, 0], [1.3, -0.8, -1.5]);
[0.4, 0, -0.4].forEach(y => add(db, new THREE.CylinderGeometry(0.7, 0.7, 0.32, 24), 0, y, 0, "db", 30));
add(part("ai", [4.7, 1.7, 0], [1.1, 1.0, 1.6]), new THREE.IcosahedronGeometry(0.8, 0), 0, 0, 0, "ai");

// connections: [part, local anchor, part, local anchor]
const CONNS = [
  ["frame", [2.6, 1.2, 0.1], "api1", [-0.6, 0, 0]], ["frame", [2.6, 0, 0.1], "api2", [-0.6, 0, 0]],
  ["frame", [2.6, -1.2, 0.1], "api3", [-0.6, 0, 0]], ["api1", [0.6, 0, 0], "ai", [-0.8, 0, 0]],
  ["api2", [0.6, 0, 0], "db", [-0.7, 0.4, 0]], ["api3", [0.6, 0, 0], "db", [-0.7, -0.4, 0]],
];
const NS = CONNS.length * 3;
const connPos = new Float32Array(NS * 6), connT = new Float32Array(NS * 2);
for (let i = 0; i < NS; i++) { const a = 0.62 + i * 0.014; connT[i * 2] = a; connT[i * 2 + 1] = a + 0.07; }
const connGeo = new THREE.BufferGeometry();
connGeo.setAttribute("position", new THREE.BufferAttribute(connPos, 3));
connGeo.setAttribute("aT", new THREE.BufferAttribute(connT, 1));
const connLines = new THREE.LineSegments(connGeo, lineMat);
connLines.frustumCulled = false;
grp.add(connLines);

// lime data packets: 4 per connection, 3-point trail each
const PK = CONNS.length * 12;
const pkPos = new Float32Array(PK * 3), pkSize = new Float32Array(PK);
for (let i = 0; i < PK; i++) pkSize[i] = [1, 0.6, 0.35][i % 3];
const pkGeo = new THREE.BufferGeometry();
pkGeo.setAttribute("position", new THREE.BufferAttribute(pkPos, 3));
pkGeo.setAttribute("aS", new THREE.BufferAttribute(pkSize, 1));
const packets = new THREE.Points(pkGeo, new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float aS; uniform float uPx; varying float vS;
    void main(){ vS = aS; gl_PointSize = aS * 11.0 * uPx; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `${LENS} uniform float uPack, uFade; varying float vS;
    void main(){
      float r = length(gl_PointCoord - .5); if (r > .5) discard;
      float a = lensIn(8.0) * uPack * (1.0 - uFade) * (1.0 - r * 1.8) * vS;
      gl_FragColor = vec4(mix(vec3(.78, .96, .2), vec3(1.), (1.0 - r * 2.0) * .6), a);
    }`,
}));
packets.frustumCulled = false;
grp.add(packets);

function updateConns(time) {
  let s = 0, k = 0;
  CONNS.forEach((c, ci) => {
    const A = parts[c[0]].position.clone().add(V3(...c[1])), B = parts[c[2]].position.clone().add(V3(...c[3]));
    const mx = (A.x + B.x) / 2, pts = [A, V3(mx, A.y, A.z), V3(mx, B.y, B.z), B];
    const len = [0, 1, 2].map(i => pts[i].distanceTo(pts[i + 1])), tot = len[0] + len[1] + len[2];
    for (let i = 0; i < 3; i++, s++) { pts[i].toArray(connPos, s * 6); pts[i + 1].toArray(connPos, s * 6 + 3); }
    for (let pk = 0; pk < 4; pk++) for (let j = 0; j < 3; j++, k++) {
      let d = ((((time * 0.2 + pk / 4 + ci * 0.37) % 1) - j * 0.02 + 1) % 1) * tot, i = 0;
      while (i < 2 && d > len[i]) { d -= len[i]; i++; }
      pts[i].clone().lerp(pts[i + 1], d / len[i]).toArray(pkPos, k * 3);
    }
  });
  connGeo.attributes.position.needsUpdate = true;
  pkGeo.attributes.position.needsUpdate = true;
}

// ---- input / lifecycle ----
const hero = $("#hero"), lensEl = $("#lens"), R = 170;
let mx = 0, my = 0, tx = innerWidth * 0.62, ty = innerHeight * 0.35, lx = tx, ly = ty, rx = 0, ry = 0;
addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; mx = tx / innerWidth * 2 - 1; my = ty / innerHeight * 2 - 1; });
let t0 = performance.now(), shown = false, dist = 13;
$("#replay").onclick = () => { hero.classList.remove("in"); void hero.offsetWidth; t0 = performance.now(); shown = false; };
function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h, false);
  cam.aspect = asp; cam.updateProjectionMatrix();
  dist = Math.max(13, 6.6 / (Math.tan(THREE.MathUtils.degToRad(20)) * asp));
  grp.position.set(asp > 1.2 ? 0.9 : 0, 0.7, 0);
}
addEventListener("resize", resize); resize();

function frame(now) {
  const t = reduced ? 99 : (now - t0) / 1000, time = now / 1000;
  const p = cl(scrollY / (innerHeight * 1.5));
  if (t > 2.6 && !shown) { hero.classList.add("in"); shown = true; }

  U.uTime.value = time;
  U.uDraw.value = (1 - Math.pow(1 - cl((t - 0.3) / 3.3), 2)) * 1.1;
  U.uBuild.value = sm(3.8, 5.6, t);
  U.uPack.value = cl(t - 4.6);
  U.uIn.value = cl(t / 1.6);

  U.uFade.value = f;

  const k = sm(4.2, 5.0, t) * (1 - sm(0.5, 0.8, p)); // lens appears after the build
  lx += (tx - lx) * 0.18; ly += (ty - ly) * 0.18;
  U.uLens.value.set(lx * DPR, (innerHeight - ly) * DPR);
  U.uR.value = R * DPR * k;
  lensEl.style.transform = `translate(${lx}px,${ly}px) scale(${k})`;
  lensEl.style.opacity = k;

  for (const n of Object.values(parts)) n.position.copy(n.userData.base).addScaledVector(n.userData.ex, e);
  updateConns(time);

  rx += (my * 0.14 - rx) * 0.06; ry += (mx * 0.3 - ry) * 0.06;
  grp.rotation.set(0.1 + rx + p * 0.2, -0.35 + ry + Math.sin(time * 0.4) * 0.04 + p * 0.25, 0);
  grp.scale.set(0.95, 0.95, 0.95 * (1 - 0.9 * f));
  cam.position.set(0, 1.6, dist - e * 1.2);
  cam.lookAt(0, 0.3, 0);

  hero.style.opacity = 1 - sm(0, 0.35, p);
  hero.style.visibility = p > 0.4 ? "hidden" : "";
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
