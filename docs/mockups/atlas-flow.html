<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas flow (ver 3.0 mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--ink:#ecebf3;--mute:#8b8a99;--line:#1f1e29;--v:#8b7bff;--l:#c6f432;--card:#0f0f16}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",monospace;letter-spacing:.08em;font-size:11px;text-transform:uppercase}
.serif{font-family:"Instrument Serif",serif;font-weight:400}

/* preloader */
#pre{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;padding:40px}
#pre .n{font-weight:900;font-size:min(34vw,420px);line-height:.8;letter-spacing:-.05em}
#pre .n span{color:var(--v)}

/* atlas */
#atlas{position:fixed;inset:0;perspective:1600px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#atlas.drag{cursor:grabbing}
#cam{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
#board{position:absolute;left:0;top:0;width:3600px;height:2400px;transform-style:preserve-3d;
  background-image:radial-gradient(#24232f 1px,transparent 1px);background-size:28px 28px;border:1px solid #15141c;border-radius:24px}
.it{position:absolute;transform-style:preserve-3d;transition:opacity .6s,filter .6s}
.it.hide{opacity:0;filter:blur(6px)}
.proj{width:400px;border:1px solid #2a2840;background:var(--card);border-radius:16px;padding:14px;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .45s}
.proj:hover{border-color:var(--v);box-shadow:0 40px 80px -30px rgba(139,123,255,.45)}
.proj .thumb{height:220px;border-radius:10px;overflow:hidden;position:relative}
.proj .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.proj h3{font-size:30px;font-weight:800;letter-spacing:-.03em}
.proj p{color:var(--mute);font-size:14px;margin-top:4px}
.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tag{border:1px solid #2a2935;border-radius:99px;padding:4px 9px;font-size:11px;color:#b9b8c6}
.tag.ai{border-color:rgba(198,244,50,.5);color:var(--l)}
.note{width:220px;background:#16151f;border:1px solid #262532;border-radius:10px;padding:16px;font-size:14px;line-height:1.5;color:#c9c8d6}
.note.lime{background:var(--l);color:#11140a;border:none;font-weight:600}
.code{width:330px;background:#0b0c10;border:1px solid #23222d;border-radius:10px;padding:14px 16px;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.7;color:#9d9cb0;white-space:pre}
.code b{color:var(--v);font-weight:500} .code i{color:var(--l);font-style:normal}
.chip{border:1px solid #2e2d3a;background:#111018;border-radius:99px;padding:10px 18px;font-size:15px;color:#d8d7e4}
.polar{width:230px;background:#e9e7df;padding:10px 10px 34px;border-radius:4px;color:#222;font-family:"Instrument Serif",serif;font-style:italic;font-size:18px}
.polar .ph{height:170px;background:linear-gradient(135deg,#ff6a2b,#2b1b10);margin-bottom:8px;display:grid;place-items:center;color:#fff;font-family:"Inter Tight";font-weight:800;font-style:normal;font-size:26px}
.hero{width:1000px;text-align:left;pointer-events:none}
.hero .eyebrow{color:var(--mute)}
.hero h1{font-size:150px;line-height:.86;font-weight:900;letter-spacing:-.055em;margin-top:18px}
.hero h1 em{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;color:var(--v);letter-spacing:-.02em}
.hero .sub{display:flex;gap:28px;margin-top:26px;color:#b9b8c6;font-size:18px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--l);margin-right:8px;box-shadow:0 0 12px var(--l)}

/* fake UIs */
.ui{position:absolute;inset:0;background:#120f24;display:grid;grid-template-columns:22% 1fr;gap:8px;padding:10px}
.ui .side{background:#1b1735;border-radius:6px}
.ui .main{display:grid;grid-template-rows:auto 1fr;gap:8px}
.ui .bar{height:16px;background:#221d44;border-radius:4px}
.ui .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ui .cards div{background:linear-gradient(160deg,#3a2f8a,#1d1840);border-radius:6px}
.ui .cards div:nth-child(2){background:linear-gradient(160deg,#c6f432,#4c6312)}

/* HUD */
.hud{position:fixed;z-index:20;pointer-events:none}
.hud a,.hud button{pointer-events:auto}
#tl{top:26px;left:30px;display:flex;gap:14px;align-items:center}
#tl b{font-weight:900;font-size:20px;letter-spacing:-.04em}
#tr{top:24px;right:30px;display:flex;gap:26px;align-items:center}
#tr a{color:var(--ink);text-decoration:none;font-size:14px}
#tr a.cta{border:1px solid #3a3950;border-radius:99px;padding:9px 16px}
#bl{bottom:26px;left:30px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
#br{bottom:26px;right:30px;display:flex;gap:14px;align-items:flex-end}
#mini{width:150px;height:100px;border:1px solid #2a2935;border-radius:8px;position:relative;background:rgba(10,10,15,.7);backdrop-filter:blur(6px)}
#mini i{position:absolute;width:6px;height:6px;border-radius:2px;background:#3d3b55}
#mini i.p{background:var(--v)}
#mini .vp{position:absolute;border:1px solid var(--l);border-radius:3px}
.btn{background:rgba(10,10,15,.7);border:1px solid #2a2935;color:var(--ink);border-radius:99px;padding:9px 14px;font:500 12px "Inter Tight";cursor:pointer}
#hint{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);z-index:20;color:var(--mute);transition:opacity .5s}

/* warp */
#warp{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}

/* detail */
#detail{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;background:var(--bg);display:none;cursor:none}
#detail section{position:relative;padding:0 6vw}
.d-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;mix-blend-mode:difference}
.d-top button{background:none;border:none;color:#fff;cursor:none;font:500 14px "Inter Tight"}
.d-hero{padding-top:8vh!important}
.d-title{font-size:clamp(90px,17vw,260px);font-weight:900;letter-spacing:-.06em;line-height:.82;overflow:hidden;display:flex}
.d-title span{display:inline-block;transform:translateY(105%)}
.d-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.d-meta div{color:#c9c8d6;font-size:15px}
.d-meta .mono{color:var(--mute);display:block;margin-bottom:6px}
.plate-wrap{perspective:1400px;margin:10vh 0 0}
.plate{height:72vh;border-radius:18px;border:1px solid #2a2840;transform-origin:50% 0;overflow:hidden;position:relative}

/* X-ray layers */
.xr{position:relative}
.xr .bones{position:absolute;inset:0;background:#03060a;clip-path:circle(0px at var(--mx,-999px) var(--my,-999px));transition:clip-path .08s linear;
  background-image:linear-gradient(rgba(198,244,50,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(198,244,50,.09) 1px,transparent 1px);background-size:40px 40px}
#detail.lens-on .xr .bones{clip-path:circle(130px at var(--mx,-999px) var(--my,-999px))}
#detail.xall .xr .bones{clip-path:circle(150% at 50% 50%)!important;transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.bx{position:absolute;border:1px dashed var(--l);color:var(--l);font:11px "JetBrains Mono";padding:6px 8px}
.bones pre{position:absolute;color:rgba(198,244,50,.75);font:12px/1.7 "JetBrains Mono"}
#lens{position:fixed;z-index:35;width:260px;height:260px;margin:-130px 0 0 -130px;border:1.5px solid var(--l);border-radius:50%;pointer-events:none;display:none;transition:width .25s,height .25s,margin .25s,opacity .25s}
#lens.small{width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--l)}
#lens .c{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);color:var(--l);font:10px "JetBrains Mono";white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:18vh 0}
.stat{border-top:1px solid var(--line);padding-top:22px}
.stat .num{font-size:clamp(70px,10vw,150px);font-weight:900;letter-spacing:-.05em;line-height:1}
.stat .num.ai{color:var(--l)}
.stat p{color:var(--mute);margin-top:8px}
.story{display:grid;grid-template-columns:1fr 2fr;gap:6vw;margin-bottom:16vh}
.story h2{font-size:clamp(36px,4vw,60px);line-height:1.08;font-weight:400}
.story h2 .w{display:inline-block;opacity:.12}
.hs{height:100vh;overflow:hidden;padding:0!important;display:flex;align-items:center}
.track{display:flex;gap:4vw;padding:0 6vw;will-change:transform}
.screen{flex:0 0 62vw;height:64vh;border-radius:16px;border:1px solid #2a2840;overflow:hidden;position:relative}
.screen .cap{position:absolute;left:18px;bottom:16px;z-index:2}
.arch{margin:18vh 0}
.arch svg{width:100%;height:auto;overflow:visible}
.arch rect{fill:#0f0f16;stroke:#2a2840}
.arch text{fill:#ecebf3;font:500 15px "Inter Tight"}
.arch text.s{fill:#8b8a99;font:11px "JetBrains Mono"}
.arch path{fill:none;stroke:var(--v);stroke-width:1.5}
.arch path.ai{stroke:var(--l)}
.next{height:90vh;display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line);cursor:none}
.next .big{font-size:clamp(90px,15vw,230px);font-weight:900;letter-spacing:-.06em;line-height:.9;transition:color .3s}
.next:hover .big{color:var(--v)}
</style>
</head>
<body>

<div id="pre"><div class="mono" style="color:var(--mute)">LKW22 STUDIO<br>VER 3.0 — LOADING ATLAS</div><div class="n" id="preN">000<span>%</span></div></div>

<div id="atlas"><div id="cam"><div id="board"></div></div></div>

<div class="hud" id="tl"><b>LKW</b><span class="mono" style="color:var(--mute)">Studio / Atlas</span></div>
<nav class="hud" id="tr"><a href="#">Work</a><a href="#">About</a><a href="#">Experience</a><a href="#" class="cta">Let's talk</a></nav>
<div class="hud mono" id="bl"><span id="coords">X 0000  Y 0000</span><span id="zoomv">ZOOM 100%</span></div>
<div class="hud" id="br"><button class="btn" id="center">Recenter</button><div id="mini"><div class="vp" id="vp"></div></div></div>
<div class="mono" id="hint">Scroll to open the atlas</div>

<canvas id="warp"></canvas>
<div id="lens"><span class="c">PRESS X FOR FULL X-RAY</span></div>
<div id="detail"></div>

<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/node_modules/gsap/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const $ = s => document.querySelector(s);
const PROJECTS = [
  { id:"coreex", name:"CoreEx", tag:"Personal operating system with an AI core", year:"2025 – now", role:"Solo, full stack", stack:["Spring Boot","Next.js","Postgres RLS","pgvector","MCP","Claude API"], x:880, y:640, z:60,
    stats:[["44","MCP tools",1],["24","Releases",0],["13","Architecture decisions",0]] },
  { id:"asteroid", name:"AsteroidUI", tag:"React component library and shadcn registry", year:"2025 – now", role:"Design and build", stack:["React","TypeScript","Tailwind","Registry"], x:2330, y:600, z:40,
    stats:[["—","Components",0],["—","Registry items",0],["—","Docs pages",0]] },
  { id:"moonwave", name:"Moonwave", tag:"Placeholder description", year:"—", role:"—", stack:["Placeholder"], x:2480, y:1360, z:30, stats:[["—","Metric",0],["—","Metric",0],["—","Metric",0]] },
  { id:"brickly", name:"Brickly", tag:"Placeholder description", year:"—", role:"—", stack:["Placeholder"], x:820, y:1430, z:50, stats:[["—","Metric",0],["—","Metric",0],["—","Metric",0]] },
  { id:"petcare", name:"PetCare", tag:"Placeholder description", year:"—", role:"—", stack:["Placeholder"], x:1640, y:1720, z:20, stats:[["—","Metric",0],["—","Metric",0],["—","Metric",0]] },
];
const uiThumb = (hue=0) => `<div class="ui" style="filter:hue-rotate(${hue}deg)"><div class="side"></div><div class="main"><div class="bar"></div><div class="cards"><div></div><div></div><div></div></div></div></div>`;

/* ---------- build board ---------- */
const board = $("#board"), items = [];
function add(html, x, y, z=0, r=0, cls="") {
  const el = document.createElement("div"); el.className = "it " + cls; el.innerHTML = html;
  el.dataset.x = x; el.dataset.y = y; el.dataset.z = z; el.dataset.r = r;
  el.style.left = x+"px"; el.style.top = y+"px"; el.style.transform = `translateZ(${z}px) rotate(${r}deg)`;
  board.appendChild(el); items.push(el); return el;
}
add(`<div class="hero"><div class="eyebrow mono">Leow Kai Wen — available for work</div>
  <h1>I design<br>and <em>build</em><br>whole products.</h1>
  <div class="sub"><span><span class="dot"></span>Full-stack developer</span><span>AI engineer</span><span class="mono" style="color:var(--mute)">Drag anywhere</span></div></div>`, 1300, 900, 0, 0, "heroItem");
PROJECTS.forEach((p,i) => {
  const el = add(`<div class="proj" data-id="${p.id}"><div class="thumb">${uiThumb(i*55)}</div>
    <div class="row"><h3>${p.name}</h3><span class="mono" style="color:var(--mute)">0${i+1}</span></div>
    <p>${p.tag}</p><div class="tags">${p.stack.slice(0,4).map(s => `<span class="tag ${/MCP|Claude|pgvector/.test(s)?"ai":""}">${s}</span>`).join("")}</div></div>`, p.x, p.y, p.z, (i%2?1.5:-1.5));
  el.classList.add("projItem");
});
add(`<div class="note">"Ship small, write the ADR, then ship again."</div>`, 1460, 500, 90, -3);
add(`<div class="note lime">Open to full-time, freelance and custom builds →</div>`, 2180, 1880, 110, 3);
add(`<div class="code"><b>@Tool</b>(name = <i>"search_notes"</i>)
<b>public</b> List&lt;Note&gt; search(String q) {
  <b>var</b> v = embed(q);   <i>// pgvector</i>
  <b>return</b> repo.nearest(v, 8);
}</div>`, 420, 1080, 70, 2);
add(`<div class="code"><i>$</i> whoami
<b>full-stack, ai</b>
<i>$</i> status
<b>open to work</b></div>`, 2960, 980, 40, -2);
["TypeScript","Java 21","Next.js","Spring Boot","PostgreSQL","Three.js","GSAP","Docker"].forEach((s,i) =>
  add(`<div class="chip">${s}</div>`, 1420 + (i%4)*190 + (i>3?90:0), 1540 + Math.floor(i/4)*70 + (i%2)*12, 20+i*6, (i%3-1)*2));
add(`<div class="polar"><div class="ph">ver 1.0</div>Where it started, 2023</div>`, 2900, 1640, 80, 5);
add(`<div class="note">Secret: press <b style="color:var(--l)">X</b> inside any project.</div>`, 3250, 2150, 30, -4);
add(`<div class="note">You found the edge of the map. Hi.</div>`, 120, 120, 30, 4);

/* minimap */
const mini = $("#mini"), SC = 150/3600;
items.forEach(el => { const d = document.createElement("i"); if (el.classList.contains("projItem")) d.className = "p"; d.style.left = el.dataset.x*SC+"px"; d.style.top = el.dataset.y*SC+"px"; mini.appendChild(d); });

/* ---------- camera ---------- */
const cam = { x:1800, y:1200, z:2.2, rx:0, ry:0 }, tgt = { x:1800, y:1200, z:2.2 };
let intro = 0, vx = 0, vy = 0, dragging = false, moved = 0, last = null, atlasActive = false;
const ease = t => 1 - Math.pow(1-t, 3);
const atlas = $("#atlas");
atlas.addEventListener("pointerdown", e => { if (intro < 1) return; dragging = true; moved = 0; last = [e.clientX, e.clientY]; atlas.classList.add("drag"); atlas.setPointerCapture(e.pointerId); });
atlas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX-last[0], dy = e.clientY-last[1]; last = [e.clientX, e.clientY]; moved += Math.abs(dx)+Math.abs(dy);
  vx = -dx/cam.z; vy = -dy/cam.z; tgt.x += vx; tgt.y += vy;
});
atlas.addEventListener("pointerup", e => {
  dragging = false; atlas.classList.remove("drag");
  if (moved < 6) { const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".proj"); if (el) openProject(el.dataset.id, el); }
});
addEventListener("wheel", e => {
  if (!atlasActive) return; e.preventDefault();
  if (intro < 1) { intro = Math.min(1, intro + Math.abs(e.deltaY)*0.0011); return; }
  tgt.z = Math.min(1.5, Math.max(.42, tgt.z * Math.exp(-e.deltaY*0.0012)));
}, { passive:false });
$("#center").onclick = () => { tgt.x = 1800; tgt.y = 1200; tgt.z = .8; };

function tick() {
  if (atlasActive) {
    if (!dragging) { tgt.x += vx; tgt.y += vy; vx *= .93; vy *= .93; }
    tgt.x = Math.max(0, Math.min(3600, tgt.x)); tgt.y = Math.max(0, Math.min(2400, tgt.y));
    const ip = ease(intro);
    if (intro < 1) tgt.z = 2.2 + (.8 - 2.2) * ip;
    cam.x += (tgt.x-cam.x)*.12; cam.y += (tgt.y-cam.y)*.12; cam.z += (tgt.z-cam.z)*.12;
    const baseRx = 16*ip, wantRx = baseRx + Math.max(-10, Math.min(10, vy*1.4)), wantRy = Math.max(-12, Math.min(12, -vx*1.4));
    cam.rx += (wantRx-cam.rx)*.08; cam.ry += (wantRy-cam.ry)*.08;
    $("#cam").style.transform = `translate3d(${innerWidth/2}px,${innerHeight/2}px,0) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg) scale(${cam.z}) translate3d(${-cam.x}px,${-cam.y}px,0)`;
    const reveal = ip * 1700;
    items.forEach(el => { if (el.classList.contains("heroItem")) return; const d = Math.hypot(+el.dataset.x-1700, +el.dataset.y-1150); el.classList.toggle("hide", d > reveal + 80); });
    $("#hint").style.opacity = intro < 1 ? 1 : 0;
    $("#coords").textContent = `X ${String(Math.round(cam.x)).padStart(4,"0")}  Y ${String(Math.round(cam.y)).padStart(4,"0")}`;
    $("#zoomv").textContent = `ZOOM ${Math.round(cam.z*100)}%  —  ${intro<1?"SCROLL":"DRAG / SCROLL TO ZOOM"}`;
    const vp = $("#vp"), w = innerWidth/cam.z*SC, h = innerHeight/cam.z*SC;
    vp.style.cssText = `left:${cam.x*SC-w/2}px;top:${cam.y*SC-h/2}px;width:${w}px;height:${h}px`;
  }
  requestAnimationFrame(tick);
}

/* ---------- preloader ---------- */
document.fonts.ready.then(() => {
  const o = { v:0 };
  gsap.to(o, { v:100, duration:1.6, ease:"power2.inOut", onUpdate: () => $("#preN").innerHTML = String(Math.round(o.v)).padStart(3,"0") + "<span>%</span>",
    onComplete: () => gsap.to("#pre", { yPercent:-100, duration:1, ease:"expo.inOut", onComplete: () => { $("#pre").remove(); } }) });
  atlasActive = true; tick();
  gsap.fromTo(".hero h1", { y:80, opacity:0 }, { y:0, opacity:1, duration:1.4, delay:2, ease:"expo.out" });
});

/* ---------- warp transition (kinetic type) ---------- */
const warp = $("#warp"), wx = warp.getContext("2d");
function drawWarp(p, word) {
  const d = Math.min(devicePixelRatio, 2), W = innerWidth, H = innerHeight;
  if (warp.width !== W*d) { warp.width = W*d; warp.height = H*d; }
  wx.setTransform(d,0,0,d,0,0);
  wx.clearRect(0,0,W,H);
  wx.fillStyle = `rgba(7,7,10,${Math.min(1, p*2.2)})`; wx.fillRect(0,0,W,H);
  wx.textAlign = "center"; wx.textBaseline = "middle";
  const n = 16, travel = p*p*n;
  for (let i = n; i >= 1; i--) {
    const z = i - travel; if (z < .25) continue;
    const sc = 1/z, a = Math.min(1, (n-z)/4) * Math.min(1, z*1.5);
    wx.font = `900 ${Math.round(H*.32*sc)}px "Inter Tight"`;
    if (i % 4 === 1) { wx.fillStyle = `rgba(139,123,255,${a})`; wx.fillText(word.toUpperCase(), W/2, H/2); }
    else { wx.strokeStyle = `rgba(236,235,243,${a*.6})`; wx.lineWidth = 1.2; wx.strokeText(word.toUpperCase(), W/2, H/2); }
  }
  if (p > .78) { const k = (p-.78)/.22; wx.fillStyle = `rgba(139,123,255,${k})`; wx.fillRect(0,0,W,H);
    wx.font = `900 ${Math.round(H*.32*(1+k*6))}px "Inter Tight"`; wx.fillStyle = `rgba(7,7,10,${k})`; wx.fillText(word.toUpperCase(), W/2, H/2); }
}
function runWarp(word, from, to, dur) {
  warp.style.display = "block"; const o = { p:from };
  return new Promise(res => gsap.to(o, { p:to, duration:dur, ease: to > from ? "power2.in" : "power2.out", onUpdate: () => drawWarp(o.p, word), onComplete: res }));
}

/* ---------- detail page ---------- */
const detail = $("#detail"), lens = $("#lens");
function detailHTML(p, i) {
  const nxt = PROJECTS[(i+1) % PROJECTS.length];
  return `
  <div class="d-top"><button id="back">← Back to atlas</button><span class="mono">0${i+1} / 0${PROJECTS.length} — ${p.name}</span><button id="xbtn">X-ray [X]</button></div>
  <section class="d-hero">
    <div class="mono" style="color:var(--mute)">Case study — ${p.year}</div>
    <h1 class="d-title">${[...p.name].map(c => `<span>${c}</span>`).join("")}</h1>
    <div class="d-meta"><div><span class="mono">Role</span>${p.role}</div><div><span class="mono">What</span>${p.tag}</div><div><span class="mono">Stack</span>${p.stack.join(", ")}</div><div><span class="mono">Links</span>GitHub ↗ · Demo on request</div></div>
    <div class="plate-wrap"><div class="plate xr">${uiThumb(i*55)}
      <div class="bones">
        <div class="bx" style="left:2%;top:4%;width:19%;height:90%">&lt;Sidebar /&gt; server component</div>
        <div class="bx" style="left:24%;top:4%;width:74%;height:8%">&lt;CommandBar /&gt; ⌘K · zod schema</div>
        <div class="bx" style="left:24%;top:16%;width:23%;height:78%">&lt;NoteCard /&gt; RSC + suspense</div>
        <div class="bx" style="left:49.5%;top:16%;width:23%;height:78%">&lt;ChatPanel /&gt; SSE stream</div>
        <pre style="left:76%;top:20%">GET /api/notes?q=
→ embed(q) 384d
→ ORDER BY v &lt;=&gt; q
→ LIMIT 8

RLS: owner_id
  = auth.uid()

p95 (to measure)</pre>
      </div></div></div>
  </section>
  <section><div class="stats">${p.stats.map(s => `<div class="stat"><div class="num ${s[2]?"ai":""}" data-n="${s[0]}">${s[0]==="—"?"—":"0"}</div><p>${s[1]}</p></div>`).join("")}</div></section>
  <section><div class="story"><div class="mono" style="color:var(--mute)">01 — The problem</div>
    <h2 class="serif reveal">${"I wanted one place for notes, chat and career data, with an AI that can actually act on it, not just talk about it.".split(" ").map(w => `<span class="w">${w}</span>`).join(" ")}</h2></div></section>
  <section class="hs"><div class="track">${["Command palette","Chat with tools","Career module","Release notes"].map((c,k) => `
    <div class="screen xr">${uiThumb(i*55 + k*30)}<div class="bones"><div class="bx" style="left:6%;top:8%;width:60%;height:40%">Screen ${k+1} wireframe</div><pre style="left:6%;top:56%">// placeholder layer
// real screenshots go here</pre></div><div class="cap mono">0${k+1} — ${c}</div></div>`).join("")}</div></section>
  <section class="arch"><div class="mono" style="color:var(--mute);margin-bottom:30px">02 — Architecture</div>
    <svg viewBox="0 0 1000 340">
      <path pathLength="1" d="M180 80 H320"/><path pathLength="1" d="M500 80 H640"/><path pathLength="1" d="M730 120 V220"/>
      <path pathLength="1" class="ai" d="M690 120 Q600 240 500 260"/><path pathLength="1" class="ai" d="M320 260 H180"/>
      ${[["Browser","client",20,40],["Next.js","app router · RSC",320,40],["Spring Boot API","Java 21",640,40],["Postgres + pgvector","RLS · embeddings",640,220],["MCP server","44 tools",320,220],["Claude API","reasoning",20,220]].map(b => `<g><rect x="${b[2]}" y="${b[3]}" width="180" height="80" rx="10"/><text x="${b[2]+18}" y="${b[3]+36}">${b[0]}</text><text class="s" x="${b[2]+18}" y="${b[3]+58}">${b[1]}</text></g>`).join("")}
    </svg></section>
  <section class="next" id="next"><div class="mono" style="color:var(--mute)">Next project</div><div class="big">${nxt.name} →</div></section>`;
}
let cur = null;
async function openProject(id, el) {
  const i = PROJECTS.findIndex(p => p.id === id), p = PROJECTS[i];
  atlasActive = false; cur = i;
  if (el) gsap.to(el, { scale:1.08, duration:.5, ease:"power2.out" });
  await runWarp(p.name, 0, 1, 1.25);
  detail.innerHTML = detailHTML(p, i); detail.style.display = "block"; detail.scrollTop = 0;
  if (el) gsap.set(el, { scale:1 });
  bindDetail(p, i);
  gsap.to(warp, { opacity:0, duration:.6, ease:"power2.out", onComplete: () => { warp.style.display = "none"; warp.style.opacity = 1; } });
  gsap.to(".d-title span", { y:0, duration:1.1, stagger:.05, ease:"expo.out", delay:.1 });
  gsap.from(".d-meta div", { y:30, opacity:0, duration:.9, stagger:.08, delay:.35, ease:"expo.out" });
}
async function closeProject() {
  const p = PROJECTS[cur];
  warp.style.opacity = 1; drawWarp(1, p.name); warp.style.display = "block";
  ScrollTrigger.getAll().forEach(t => t.kill()); detail.style.display = "none"; detail.innerHTML = ""; lens.style.display = "none";
  await runWarp(p.name, 1, 0, 1); warp.style.display = "none"; atlasActive = true; requestAnimationFrame(() => 0);
}
function bindDetail(p, i) {
  const S = { scroller: detail };
  ScrollTrigger.defaults(S);
  gsap.fromTo(".plate", { rotateX:38, scale:.82, y:40 }, { rotateX:0, scale:1, y:0, ease:"none", scrollTrigger:{ trigger:".plate-wrap", start:"top 95%", end:"top 15%", scrub:1 } });
  document.querySelectorAll(".stat .num").forEach(n => { const v = parseInt(n.dataset.n); if (isNaN(v)) return; const o = { v:0 };
    gsap.to(o, { v, duration:1.6, ease:"power3.out", onUpdate: () => n.textContent = Math.round(o.v), scrollTrigger:{ trigger:n, start:"top 85%" } }); });
  gsap.to(".story .w", { opacity:1, stagger:.05, ease:"none", scrollTrigger:{ trigger:".story", start:"top 75%", end:"bottom 45%", scrub:true } });
  const track = $(".track"), dist = () => track.scrollWidth - innerWidth;
  gsap.to(track, { x:() => -dist(), ease:"none", scrollTrigger:{ trigger:".hs", start:"top top", end:() => "+=" + dist(), pin:true, scrub:1, invalidateOnRefresh:true } });
  gsap.fromTo(".arch path", { strokeDasharray:1, strokeDashoffset:1 }, { strokeDashoffset:0, stagger:.15, ease:"none", scrollTrigger:{ trigger:".arch", start:"top 75%", end:"bottom 60%", scrub:1 } });
  gsap.from(".arch g", { opacity:0, y:20, stagger:.08, duration:.8, ease:"expo.out", scrollTrigger:{ trigger:".arch", start:"top 75%" } });
  ScrollTrigger.refresh();
  $("#back").onclick = closeProject;
  $("#xbtn").onclick = () => detail.classList.toggle("xall");
  $("#next").onclick = async () => { const n = PROJECTS[(i+1) % PROJECTS.length];
    await runWarp(n.name, 0, 1, 1.1); ScrollTrigger.getAll().forEach(t => t.kill()); detail.classList.remove("xall");
    detail.innerHTML = detailHTML(n, (i+1) % PROJECTS.length); detail.scrollTop = 0; cur = (i+1) % PROJECTS.length; bindDetail(n, cur);
    gsap.to(warp, { opacity:0, duration:.6, onComplete: () => { warp.style.display = "none"; warp.style.opacity = 1; } });
    gsap.to(".d-title span", { y:0, duration:1.1, stagger:.05, ease:"expo.out" }); };
}
detail.addEventListener("pointermove", e => {
  lens.style.display = "block"; lens.style.left = e.clientX+"px"; lens.style.top = e.clientY+"px";
  let over = false;
  detail.querySelectorAll(".xr").forEach(x => { const r = x.getBoundingClientRect();
    x.style.setProperty("--mx", (e.clientX-r.left)+"px"); x.style.setProperty("--my", (e.clientY-r.top)+"px");
    if (e.clientX>r.left && e.clientX<r.right && e.clientY>r.top && e.clientY<r.bottom) over = true; });
  detail.classList.toggle("lens-on", over); lens.classList.toggle("small", !over);
});
detail.addEventListener("scroll", () => detail.querySelectorAll(".xr").forEach(x => x.style.setProperty("--my", "-999px")));
addEventListener("keydown", e => {
  if (detail.style.display !== "block") return;
  if (e.key.toLowerCase() === "x") detail.classList.toggle("xall");
  if (e.key === "Escape") closeProject();
});
</script>
</body>
</html>
